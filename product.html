<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tinkers | Product Detail</title>

  <link rel="stylesheet" href="css/styles.css" />
  <link rel="stylesheet" href="css/additions.css" />
</head>

<body class="detail-page">

<header class="site-header compact">
  <div class="logo-wrap">
    <div class="logo-mark">T</div>
    <div>
      <div class="brand">Tinkers</div>
      <div class="tag">Product detail</div>
    </div>
  </div>

  <div class="detail-actions-top">
    <a href="index.html" class="secondary-btn">← Back to shop</a>
    <button class="cart-btn" id="cartButton">
      Cart <span id="cartCount">0</span>
    </button>
  </div>
</header>

<main class="detail-layout" id="detailRoot">
  <!-- Product details injected by js/app.js -->
</main>

<div class="cart-panel" id="cartPanel" aria-hidden="true">
  <div class="cart-header">
    <h3>Your cart</h3>
    <button id="closeCart" class="icon-btn">✕</button>
  </div>

  <div id="cartItems" class="cart-items"></div>

  <div class="cart-footer">
    <div class="cart-total">
      Total: <strong id="cartTotal">R0</strong>
    </div>
    <a class="checkout-btn" href="checkout.html">Proceed to checkout</a>
    <p class="cart-note">Demo cart only — ready for future payment integration.</p>
  </div>
</div>

<script src="js/app.js"></script>
</body>
</html>
