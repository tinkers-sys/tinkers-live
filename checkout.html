<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checkout | Tinkers</title>

<link rel="stylesheet" href="css/styles.css">
<link rel="stylesheet" href="css/additions.css">

<style>
input, textarea {
  width: 100%;
  padding: 10px;
  margin-bottom: 10px;
  border-radius: 6px;
  border: 1px solid #ddd;
}

label {
  font-weight: 600;
  font-size: 14px;
}

input:focus:valid, textarea:focus:valid {
  border: 1px solid #2ecc71;
}

input:invalid, textarea:invalid {
  border: 1px solid #e74c3c;
}
</style>

</head>

<body>

<header class="header">
  <h2>Tinkers</h2>
  <nav>
    <a href="index.html">Back to shop</a>
  </nav>
</header>

<main class="checkout-wrap">

<h2>Checkout</h2>

<!-- ✅ CART -->
<div id="cart"></div>
<h3>Total: <span id="checkoutTotal">R0</span></h3>

<!-- ✅ DELIVERY -->
<div style="margin-top:20px;">
  <strong>Delivery Option</strong><br>

  <label>
    <input type="radio" name="delivery" value="collection" checked>
    Collection (Free)
  </label><br>

  <label>
    <input type="radio" name="delivery" value="delivery">
    Delivery (+R100)
  </label>
</div>

<!-- ✅ CUSTOMER FORM -->
<div style="margin-top:20px;">
  <h3>Customer Details</h3>

  <label>Full Name</label>
  <input type="text" id="custName" placeholder="Enter your full name">

  <label>Phone Number</label>
  <input type="tel" id="custPhone" placeholder="0821234567 or +27821234567">
  <small style="color:#888;">Format: 0821234567 or +27821234567</small>

  <label>Email (optional)</label>
  <input type="email" id="custEmail" placeholder="example@email.com">

  <div id="addressBlock" style="display:none;">
    <label>Delivery Address</label>
    <textarea id="custAddress" placeholder="Street, City, Postal Code"></textarea>
  </div>

  <label>Order Notes</label>
  <textarea id="custNotes" placeholder="Optional notes..."></textarea>
</div>

<!-- ✅ SUMMARY -->
<div style="margin-top:20px; padding:15px; background:#f7f7f7; border-radius:8px;">
  <h3>Order Summary</h3>
  <div id="summaryItems"></div>
  <p><strong>Total: <span id="summaryTotal">R0</span></strong></p>
</div>

<!-- ✅ PAYFAST -->
<form id="payfastForm" action="https://sandbox.payfast.co.za/eng/process" method="post">

  <input type="hidden" name="merchant_id" value="10000100">
  <input type="hidden" name="merchant_key" value="46f0cd694581a">

  <input type="hidden" name="amount" id="pf_amount">
  <input type="hidden" name="item_name" id="pf_item_name">

  <input type="hidden" name="return_url" value="https://tinkers-sys.github.io/tinkers-live/thank-you.html">
  <input type="hidden" name="cancel_url" value="https://tinkers-sys.github.io/tinkers-live/checkout.html">

  <button type="button" onclick="payNow()" class="primary-btn">
    Pay Now
  </button>

</form>

<!-- ✅ WHATSAPP -->
<button onclick="whatsappCart()" style="
  background:#25D366;
  color:white;
  padding:14px;
  border:none;
  border-radius:8px;
  margin-top:10px;
  width:100%;
">
💬 Checkout via WhatsApp
</button>

</main>

<script src="js/app.js"></script>

<script>

/* ===============================
   TOGGLE ADDRESS
================================ */
function toggleAddress() {
  const delivery = document.querySelector('input[name="delivery"]:checked')?.value;
  document.getElementById("addressBlock").style.display =
    delivery === "delivery" ? "block" : "none";
}

/* ===============================
   SUMMARY
================================ */
function renderSummary() {
  const cart = JSON.parse(localStorage.getItem("tinkers_cart_v1") || "[]");
  const container = document.getElementById("summaryItems");
  const totalEl = document.getElementById("summaryTotal");

  let total = 0;
  container.innerHTML = "";

  cart.forEach(item => {
    const p = window.__products?.find(x => x.id === item.id);
    if (!p) return;

    const lineTotal = p.price * item.qty;
    total += lineTotal;

    container.innerHTML += `<p>${p.name} × ${item.qty} = R${lineTotal}</p>`;
  });

  const delivery = document.querySelector('input[name="delivery"]:checked')?.value;
  if (delivery === "delivery") total += 100;

  totalEl.textContent = "R" + total;
}

/* ===============================
   PHONE FORMAT (SA)
================================ */
document.getElementById("custPhone").addEventListener("input", function () {
  let value = this.value.replace(/\D/g, "");

  if (value.startsWith("0")) {
    value = "+27" + value.substring(1);
  }
  this.value = value;
});

/* ===============================
   PAYNOW
================================ */
function payNow() {

  const cart = JSON.parse(localStorage.getItem("tinkers_cart_v1") || "[]");

  const name = custName.value.trim();
  const phone = custPhone.value.trim();
  const email = custEmail.value.trim();
  const address = custAddress.value.trim();
  const delivery = document.querySelector('input[name="delivery"]:checked')?.value;

  if (name.length < 3) {
    alert("Enter your full name");
    return;
  }

  const phoneRegex = /^(\+27|0)[0-9]{9}$/;
  if (!phoneRegex.test(phone)) {
    alert("Invalid phone number format");
    return;
  }

  if (email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
    alert("Invalid email");
    return;
  }

  if (delivery === "delivery" && address.length < 10) {
    alert("Enter full address");
    return;
  }

  let total = 0;
  let items = [];

  cart.forEach(item => {
    const p = window.__products.find(x => x.id === item.id);
    if (!p) return;

    total += p.price * item.qty;
    items.push(`${p.name} x${item.qty}`);
  });

  if (delivery === "delivery") {
    total += 100;
    items.push("Delivery");
  }

  items.push(`Name: ${name}`);
  items.push(`Phone: ${phone}`);

  document.getElementById("pf_amount").value = total.toFixed(2);
  document.getElementById("pf_item_name").value = items.join(", ");

  document.getElementById("payfastForm").submit();
}

/* ===============================
   WHATSAPP
================================ */
function whatsappCart() {

  const name = custName.value;
  const phone = custPhone.value;
  const address = custAddress.value;

  let message = `Hi Tinkers,\n\nName: ${name}\nPhone: ${phone}\n\nOrder:\n`;

  let total = 0;

  const cart = JSON.parse(localStorage.getItem("tinkers_cart_v1") || "[]");

  cart.forEach(item => {
    const p = window.__products.find(x => x.id === item.id);
    if (!p) return;

    const lineTotal = p.price * item.qty;
    total += lineTotal;

    message += `• ${p.name} x${item.qty} - R${lineTotal}\n`;
  });

  const delivery = document.querySelector('input[name="delivery"]:checked')?.value;

  if (delivery === "delivery") {
    total += 100;
    message += "• Delivery - R100\n";
    message += `Address: ${address}\n`;
  }

  message += `\nTotal: R${total}`;

  window.open(
    `https://wa.me/27682525454?text=${encodeURIComponent(message)}`,
    "_blank"
  );
}

/* ===============================
   INIT
================================ */
document.addEventListener("DOMContentLoaded", () => {
  renderSummary();
  toggleAddress();
});

document.addEventListener("change", e => {
  if (e.target.name === "delivery") {
    toggleAddress();
    renderSummary();
  }
});

</script>

</body>
</html>
