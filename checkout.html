<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tinkers Checkout</title>

<link rel="stylesheet" href="css/styles.css">
<link rel="stylesheet" href="css/additions.css">

</head>

<body>

<header class="header">
  <div class="container">
    <h2>Checkout</h2>

    <nav>
      <a href="index.html">Home</a>
    </nav>
  </div>
</header>

<main class="container checkout-layout">
  <a href="index.html" class="btn-back">
  ← Back to Shopping
</a>

  <!-- LEFT: CART -->
  <div class="checkout-left">

    <h2>Your Cart</h2>
    <div id="cart"></div>

  </div>

  <!-- RIGHT: SUMMARY -->
  <div class="checkout-right">

    <h3>Order Summary</h3>

    <p class="total-box">
      Total: <span id="checkoutTotal">R0</span>
    </p>

    <div class="checkout-actions">

      <button class="btn-clear" onclick="clearCart()">
        Clear Cart
      </button>

      <button class="btn-whatsapp" onclick="whatsappCart()">
        WhatsApp Order
      </button>

      <button class="btn-payflex" onclick="payflexCheckout()">
        Payflex Demo
      </button>

      <form action="https://sandbox.payfast.co.za/eng/process" method="post">

        <input type="hidden" name="merchant_id" value="10000100">
        <input type="hidden" name="merchant_key" value="46f0cd694581a">

        <input type="hidden" name="amount" id="payfastAmount">
        <input type="hidden" name="item_name" value="Tinkers Order">

        <button class="btn-payfast" type="submit">
          Pay with Card
        </button>

      </form>

    </div>

  </div>

</main>
