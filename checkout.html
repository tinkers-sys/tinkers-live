<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checkout | Tinkers</title>

<link rel="stylesheet" href="css/styles.css">
<link rel="stylesheet" href="css/additions.css">
</head>

<body>

<header class="header">
  <h2>Tinkers</h2>
  <nav>
    <a href="index.html">Back to shop</a>
  </nav>
</header>

<main class="checkout-wrap">

<h2>Checkout</h2>

<!-- ✅ CART -->
<div id="cart"></div>

<h3>Total: <span id="checkoutTotal">R0</span></h3>

<!-- ✅ DELIVERY -->
<div style="margin-top:20px;">
  <strong>Delivery Option:</strong><br>

  <label>
    <input type="radio" name="delivery" value="collection" checked>
    Collection (Free)
  </label><br>

  <label>
    <input type="radio" name="delivery" value="delivery">
    Delivery (+R100)
  </label>
</div>

<!-- ✅ CUSTOMER FORM -->
<!-- ✅ CUSTOMER DETAILS -->
<div style="margin-top:20px;">
  <h3>Customer Details</h3>

  <!-- ✅ NAME -->
  <label>Full Name</label>
  <input type="text" id="custName" placeholder="Enter your full name"
    style="width:100%; padding:10px; margin-bottom:10px;">

  <!-- ✅ PHONE -->
  <label>Phone Number</label>
  <input type="tel" id="custPhone" placeholder="+27..."
    style="width:100%; padding:10px; margin-bottom:10px;">

  <!-- ✅ EMAIL (NEW FIELD) -->
  <label>Email (optional)</label>
  <input type="email" id="custEmail" placeholder="example@email.com"
    style="width:100%; padding:10px; margin-bottom:10px;">

  <!-- ✅ ADDRESS (AUTO SHOWN FOR DELIVERY ONLY) -->
  <div id="addressBlock" style="display:none;">
    <label>Delivery Address</label>
    <textarea id="custAddress" placeholder="Street, City, Postal Code"
      style="width:100%; padding:10px; margin-bottom:10px;"></textarea>
  </div>

  <!-- ✅ NOTES -->
  <label>Order Notes (optional)</label>
  <textarea id="custNotes" placeholder="e.g. Call before delivery"
    style="width:100%; padding:10px;"></textarea>
</div>

<!-- ✅ ORDER SUMMARY -->
<div style="margin-top:20px; padding:15px; background:#f7f7f7; border-radius:8px;">
  <h3>Order Summary</h3>
  <div id="summaryItems"></div>
  <p><strong>Total: <span id="summaryTotal">R0</span></strong></p>
</div>

<!-- ✅ PAYFAST -->
<form id="payfastForm" method="post" action="https://sandbox.payfast.co.za/eng/process">

  <!-- ✅ REQUIRED PAYFAST FIELDS -->
  <input type="hidden" name="merchant_id" value="10000100">
  <input type="hidden" name="merchant_key" value="46f0cd694581a">

  <!-- ✅ ORDER DETAILS -->
  <input type="hidden" name="amount" id="pf_amount">
  <input type="hidden" name="item_name" id="pf_item_name">

  <!-- ✅ OPTIONAL URLs -->
  <input type="hidden" name="return_url" value="https://tinkers-sys.github.io/tinkers-live/thank-you.html">
  <input type="hidden" name="cancel_url" value="https://tinkers-sys.github.io/tinkers-live/checkout.html">

  <button type="button" onclick="payNow()" class="primary-btn">
    Pay Now
  </button>

</form>

<!-- ✅ WHATSAPP -->
<button onclick="whatsappCart()" style="
  background:#25D366;
  color:white;
  padding:14px;
  border:none;
  border-radius:8px;
  margin-top:10px;
  width:100%;
">
💬 Checkout via WhatsApp
</button>

</main>

<!-- ✅ APP -->
<script src="js/app.js"></script>

<script>

/* ===============================
   SUMMARY
================================ */
function renderSummary() {
  const cart = JSON.parse(localStorage.getItem("tinkers_cart_v1") || "[]");
  const container = document.getElementById("summaryItems");
  const totalEl = document.getElementById("summaryTotal");

  let total = 0;
  container.innerHTML = "";

  cart.forEach(item => {
    if (!window.__products) return;

    const p = window.__products.find(x => x.id === item.id);
    if (!p) return;

    const lineTotal = p.price * item.qty;
    total += lineTotal;

    container.innerHTML += `<p>${p.name} × ${item.qty} = R${lineTotal}</p>`;
  });

  const delivery = document.querySelector('input[name="delivery"]:checked')?.value;

  if (delivery === "delivery") total += 100;

  totalEl.textContent = "R" + total;
}

/* ===============================
   DELIVERY CHANGE
================================ */
document.addEventListener("change", e => {
  if (e.target.name === "delivery") renderSummary();
});

/* ===============================
   PAYFAST
================================ */
function payNow() {

  const cart = JSON.parse(localStorage.getItem("tinkers_cart_v1") || "[]");

  if (!cart.length) {
    alert("Cart empty");
    return;
  }

  const name = document.getElementById("custName").value;
  const phone = document.getElementById("custPhone").value;
  const address = document.getElementById("custAddress").value;

  const delivery = document.querySelector('input[name="delivery"]:checked')?.value;

  if (!name || !phone) {
    alert("Fill name and phone");
    return;
  }

  if (delivery === "delivery" && !address) {
    alert("Enter delivery address");
    return;
  }

  let total = 0;
  let items = [];

  cart.forEach(item => {
    const p = window.__products.find(x => x.id === item.id);
    if (!p) return;

    total += p.price * item.qty;
    items.push(`${p.name} x${item.qty}`);
  });

  if (delivery === "delivery") {
    total += 100;
    items.push("Delivery");
  }

  items.push(`Name: ${name}`);
  items.push(`Phone: ${phone}`);

  document.getElementById("pf_amount").value = total.toFixed(2);
  document.getElementById("pf_item_name").value = items.join(", ");

  document.getElementById("payfastForm").submit();
}

/* ===============================
   WHATSAPP
================================ */
function whatsappCart() {

  const cart = JSON.parse(localStorage.getItem("tinkers_cart_v1") || "[]");

  if (!cart.length) {
    alert("Cart empty");
    return;
  }

  const name = document.getElementById("custName").value;
  const phone = document.getElementById("custPhone").value;
  const address = document.getElementById("custAddress").value;

  let message = `Hi Tinkers,\n\nName: ${name}\nPhone: ${phone}\n\nOrder:\n`;

  let total = 0;

  cart.forEach(item => {
    const p = window.__products.find(x => x.id === item.id);
    if (!p) return;

    const lineTotal = p.price * item.qty;
    total += lineTotal;

    message += `• ${p.name} x${item.qty} - R${lineTotal}\n`;
  });

  const delivery = document.querySelector('input[name="delivery"]:checked')?.value;

  if (delivery === "delivery") {
    total += 100;
    message += "• Delivery - R100\n";
    message += `Address: ${address}\n`;
  }

  message += `\nTotal: R${total}`;

  window.open(
    `https://wa.me/27682525454?text=${encodeURIComponent(message)}`,
    "_blank"
  );
}

document.addEventListener("DOMContentLoaded", renderSummary);

</script>

</body>
</html>
