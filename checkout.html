<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Checkout | Tinkers</title>

  <link rel="stylesheet" href="css/styles.css" />
</head>

<body style="padding:20px; font-family:Arial;">

<h1>Checkout</h1>

<div id="checkoutGrid"></div>

<h2 id="checkoutTotal">R 0.00</h2>

<button onclick="whatsappCheckout()" style="background:#28a745; color:white; padding:12px; width:100%; margin-top:10px;">
  WhatsApp Checkout
</button>

<button onclick="payFastCheckout()" style="background:#28a745; color:white; padding:12px; width:100%; margin-top:10px;">
  Pay with Card (PayFast)
</button>

<button onclick="clearCart()" style="margin-top:10px;">
  Clear Cart
</button>

<br><br>
<a href="index.html">← Continue Shopping</a>

<script>

/* ===============================
✅ LOAD CHECKOUT
=============================== */
function loadCheckout() {

  let cart = JSON.parse(localStorage.getItem("cart")) || [];

  let total = 0;
  let html = "";

  if (cart.length === 0) {
    document.getElementById("checkoutGrid").innerHTML =
      "<p>Your cart is empty</p>";
    return;
  }

  cart.forEach(item => {

    let subtotal = item.price * item.qty;
    total += subtotal;

    html += `
      <div style="padding:10px; border-bottom:1px solid #ccc;">
        <strong>${item.name}</strong><br>
        ${item.qty} x R ${item.price} = <strong>R ${subtotal.toFixed(2)}</strong>
      </div>
    `;
  });

  document.getElementById("checkoutGrid").innerHTML = html;
  document.getElementById("checkoutTotal").innerText = "Total: R " + total.toFixed(2);
}

/* ===============================
✅ CLEAR CART
=============================== */
function clearCart() {
  localStorage.removeItem("cart");
  location.reload();
}

/* ===============================
✅ WHATSAPP CHECKOUT
=============================== */
function whatsappCheckout() {

  let cart = JSON.parse(localStorage.getItem("cart")) || [];

  let msg = "🧾 Tinkers Order\n\n";
  let total = 0;

  cart.forEach(item => {
    let sub = item.price * item.qty;
    total += sub;

    msg += `${item.name} x${item.qty} - R ${sub.toFixed(2)}\n`;
  });

  msg += `\nTotal: R ${total.toFixed(2)}`;

  window.open(
    `https://wa.me/27720912943?text=${encodeURIComponent(msg)}`,
    "_blank"
  );
}

/* ===============================
✅ PAYFAST (BASIC)
=============================== */
function payFastCheckout() {

  let cart = JSON.parse(localStorage.getItem("cart")) || [];
  let total = 0;

  cart.forEach(item => {
    total += item.price * item.qty;
  });

  if (total === 0) {
    alert("Cart is empty ❌");
    return;
  }

  // TEMP: simulate payment
  alert("Redirecting to PayFast with amount: R " + total.toFixed(2));

  // REAL PayFast integration comes next step
}

/* ===============================
✅ INIT
=============================== */
document.addEventListener("DOMContentLoaded", loadCheckout);

</script>

</body>
</html>
