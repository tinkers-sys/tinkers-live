<html lang="en">
<head>

<link rel="stylesheet" href="css/styles.css">
<link rel="stylesheet" href="css/additions.css?v=final-tuning">
  <!-- Google Analytics -->
<script async src="https://www.googletagmanager.com/gtag/js?id= G-5GFFP9FW2T"></script>

<body>

<header class="header">
  <h2>Tinkers</h2>
  <nav>
    <a href="index.html">← Back to shop</a>
  </nav>
</header>

<main class="checkout-wrap">

  <h2>Checkout</h2>

  <!-- CART CONTENT -->
  <div id="cart" class="checkout-cart"></div>

  <!-- SUMMARY -->
  <div class="checkout-summary">

    <p>
      Total:
      <strong id="checkoutTotal">R0</strong>
    </p>

    <!-- BUTTONS (plain & visible) -->
    <div style="display:flex; gap:12px; margin-top:15px;">
      <button onclick="whatsappCart()" style="
  background:#25D366;
  color:white;
  padding:14px 24px;
  border:none;
  border-radius:8px;
  font-weight:600;
  margin-top:10px;
">
  💬 Checkout via WhatsApp
</button>

      <button onclick="payNow()">Pay with PayFast</button>
      <button onclick="clearCart()">Clear cart</button>
    </div>

    <p style="margin-top:12px; font-size:14px; color:#666;">
      Sandbox checkout via PayFast (test mode).
    </p>

  </div>

</main>
  <div id="orderSummary" style="
  margin-top:20px;
  padding:15px;
  background:#f7f7f7;
  border-radius:8px;
">
  <h3>Order Summary</h3>
  <div id="summaryItems"></div>
  <p><strong>Total: <span id="summaryTotal">R0</span></strong></p>
</div>

<!-- PAYFAST FORM -->
<form
  id="payfastForm"
  method="post"
  action="https://sandbox.payfast.co.za/eng/process"
  style="display:none;"
>
  <input type="hidden" name="merchant_id" value="10000100">
  <input type="hidden" name="merchant_key" value="46f0cd694581a">

  <input type="hidden" name="return_url"
         value="https://tinkers-sys.github.io/tinkers-live/thank-you.html">

  <input type="hidden" name="cancel_url"
         value="https://tinkers-sys.github.io/tinkers-live/checkout.html">

  <input type="hidden" name="notify_url" value="https://example.com/notify">

  <input type="hidden" name="amount" id="pf_amount">
  <input type="hidden" name="item_name" id="pf_item_name">
</form>

<script src="js/app.js"></script>
<script>
function renderSummary() {
  const cart = JSON.parse(localStorage.getItem("tinkers_cart_v1") || "[]");

  const container = document.getElementById("summaryItems");
  const totalEl = document.getElementById("summaryTotal");

  if (!container) return;

  let total = 0;
  container.innerHTML = "";

  cart.forEach(item => {
    const product = window.__products?.find(p => p.id === item.id);

    if (!product) return;

    const lineTotal = product.price * item.qty;
    total += lineTotal;

    container.innerHTML += `
      <p>${product.name} × ${item.qty} = R${lineTotal}</p>
    `;
  });

  totalEl.textContent = "R" + total;
}

document.addEventListener("DOMContentLoaded", renderSummary);
</script>
</body>
