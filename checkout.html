<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tinkers Checkout</title>

<link rel="stylesheet" href="css/styles.css">
<link rel="stylesheet" href="css/additions.css">

</head>

<body>

<header class="header">
  <div class="container">
    <h2>Checkout</h2>

    <nav>
      <a href="index.html">Home</a>
    </nav>
  </div>
</header>

<main class="container">

  <!-- ✅ BACK TO SHOPPING -->
  <a href="index.html" class="btn-back">← Back to Shopping</a>

  <h2>Your Cart</h2>

  <!-- ✅ CART GRID -->
  <div id="cart"></div>

  <!-- ✅ TOTAL -->
  <h3 class="total-box">
    Total: <span id="checkoutTotal">R0</span>
  </h3>

  <!-- ✅ ACTION BUTTONS -->
  <div class="checkout-actions">

    <button class="btn-clear" onclick="clearCart()">Clear Cart</button>

    <button class="btn-whatsapp" onclick="whatsappCart()">
      WhatsApp Order
    </button>

    <button class="btn-payflex" onclick="payflexCheckout()">
      Payflex Demo
    </button>

    <!-- ✅ PAYFAST FORM -->
    <form action="https://sandbox.payfast.co.za/eng/process" method="post">

      <!-- ✅ TEST MERCHANT -->
      <input type="hidden" name="merchant_id" value="10000100">
      <input type="hidden" name="merchant_key" value="46f0cd694581a">

      <!-- ✅ IMPORTANT: SUCCESS + RETURN -->
     <input type="hidden" name="return_url" value="https://yourname.github.io/tinkers-live/success.html">
      <input type="hidden" name="cancel_url" value="https://yourname.github.io/tinkers-live/checkout.html">

      <!-- ✅ AUTO TOTAL -->
      <input type="hidden" name="amount" id="payfastAmount" value="0">

      <input type="hidden" name="item_name" value="Tinkers Order">

      <button class="btn-payfast" type="submit">
        Pay with Card
      </button>

    </form>

  </div>

</main>

<!-- ✅ JS -->
<script src="js/app.js"></script>

</body>
</html>
