<main class="checkout-wrap">

  <h2>Checkout</h2>

  <!-- ✅ CART ITEMS (rendered by app.js) -->
  <div id="cart" class="checkout-cart"></div>

  <!-- ✅ SUMMARY / ACTIONS -->
  <div class="checkout-summary">
    <div class="checkout-total">
      Total: <strong id="checkoutTotal">R0</strong>
    </div>

    <div class="checkout-actions">
      <button onclick="payNow()" class="primary-btn">
        Pay with PayFast
      </button>

      <button onclick="clearCart()" class="secondary-btn">
        Clear cart
      </button>
    </div>

    <p class="cart-note">
      Sandbox checkout via PayFast (test mode).
    </p>
  </div>

</main>
