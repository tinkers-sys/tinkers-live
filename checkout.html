<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Checkout | Tinkers</title>

  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/additions.css">
</head>

<body class="container">

<h1>🛒 Checkout</h1>

<!-- ✅ GRID -->
<div id="checkoutGrid" class="checkout-grid"></div>

<!-- ✅ TOTAL -->
<h2 id="checkoutTotal">Total: R 0.00</h2>

<!-- ✅ ACTION BUTTONS -->
<button class="checkout-btn whats" onclick="whatsappCheckout()">
  WhatsApp Order
</button>

<button class="checkout-btn pay" onclick="goToShopifyCheckout()">
  Pay Securely
</button>

<button onclick="clearCart()">Clear Cart</button>

<br><br>
<a href="index.html">← Continue Shopping</a>

<script>

/* ===============================
✅ CART HELPERS
=============================== */
function getCart() {
  return JSON.parse(localStorage.getItem("cart")) || [];
}

function saveCart(cart) {
  localStorage.setItem("cart", JSON.stringify(cart));
}

/* ===============================
✅ LOAD CHECKOUT
=============================== */
function loadCheckout() {

  let cart = getCart();
  let total = 0;
  let html = "";

  if (cart.length === 0) {
    document.getElementById("checkoutGrid").innerHTML =
      "<p>Your cart is empty</p>";
    document.getElementById("checkoutTotal").innerText = "";
    return;
  }

  cart.forEach(item => {

    let subtotal = item.price * item.qty;
    total += subtotal;

    html += `
      <div class="checkout-card">

        <img src="images/${item.image}" alt="${item.name}">

        <h3>${item.name}</h3>

        <p>${item.qty} × R ${item.price}</p>

        <div class="qty-controls">
          <button onclick="changeQty('${item.id}', 1)">+</button>
          <button onclick="changeQty('${item.id}', -1)">−</button>
        </div>

        <strong>R ${subtotal.toFixed(2)}</strong>

      </div>
    `;
  });

  document.getElementById("checkoutGrid").innerHTML = html;
  document.getElementById("checkoutTotal").innerText =
    "Total: R " + total.toFixed(2);
}

/* ===============================
✅ CHANGE QTY
=============================== */
function changeQty(id, amt) {

  let cart = getCart();
  let item = cart.find(i => i.id === id);

  if (!item) return;

  item.qty += amt;

  if (item.qty <= 0) {
    cart = cart.filter(i => i.id !== id);
  }

  saveCart(cart);
  loadCheckout();
}

/* ===============================
✅ CLEAR CART
=============================== */
function clearCart() {
  localStorage.removeItem("cart");
  loadCheckout();
}

/* ===============================
✅ SHOPIFY CHECKOUT (FINAL)
=============================== */
function goToShopifyCheckout() {

  let cart = getCart();

  if (cart.length === 0) {
    alert("Cart is empty ❌");
    return;
  }

  let cartString = cart.map(item => {
    let variantId = item.id.split('/').pop();
    return variantId + ":" + item.qty;
  }).join(",");

  window.location.href =
    "https://tinkers-8375.myshopify.com/cart/" +
    cartString +
    "?checkout";
}

/* ===============================
✅ WHATSAPP
=============================== */
function whatsappCheckout() {

  let cart = getCart();
  let msg = "🧾 Tinkers Order\n\n";
  let total = 0;

  cart.forEach(item => {
    let sub = item.price * item.qty;
    total += sub;

    msg += `${item.name} x${item.qty} - R ${sub.toFixed(2)}\n`;
  });

  msg += `\nTotal: R ${total.toFixed(2)}`;

  window.open(
    `https://wa.me/27720912943?text=${encodeURIComponent(msg)}`,
    "_blank"
  );
}

/* ===============================
✅ INIT
=============================== */
document.addEventListener("DOMContentLoaded", loadCheckout);

</script>

</body>
</html>
