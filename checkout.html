<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Checkout | Tinkers</title>

  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/additions.css">
</head>

<body class="container">

<h1>Checkout</h1>

<div id="checkoutGrid" class="checkout-grid"></div>

<h2 id="checkoutTotal">Total: R 0.00</h2>

<button class="checkout-btn whats" onclick="whatsappCheckout()">
  WhatsApp Checkout
</button>

<button class="checkout-btn pay" onclick="payFastCheckout()">
  Pay with Card (PayFast)
</button>

<button onclick="clearCart()">Clear Cart</button>

<br><br>
<a href="index.html">← Continue Shopping</a>

<script>

/* ===============================
✅ HELPERS
=============================== */
function getCart() {
  return JSON.parse(localStorage.getItem("cart")) || [];
}

function saveCart(cart) {
  localStorage.setItem("cart", JSON.stringify(cart));
}

/* ===============================
✅ LOAD CHECKOUT GRID
=============================== */
function loadCheckout() {

  let cart = getCart();
  let total = 0;
  let html = "";

  if (cart.length === 0) {
    document.getElementById("checkoutGrid").innerHTML =
      "<p>Your cart is empty</p>";
    return;
  }

  cart.forEach(item => {

    let subtotal = item.price * item.qty;
    total += subtotal;

    html += `
      <div class="checkout-card">

        <img src="images/${item.image}">

        <h3>${item.name}</h3>

        <p>${item.qty} x R ${item.price}</p>

        <div class="qty-controls">
          <button onclick="changeQty('${item.id}', 1)">+</button>
          <button onclick="changeQty('${item.id}', -1)">−</button>
        </div>

        <strong>R ${subtotal.toFixed(2)}</strong>

      </div>
    `;
  });

  document.getElementById("checkoutGrid").innerHTML = html;
  document.getElementById("checkoutTotal").innerText =
    "Total: R " + total.toFixed(2);
}

/* ===============================
✅ QUANTITY UPDATE
=============================== */
function changeQty(id, amt) {

  let cart = getCart();

  let item = cart.find(i => i.id === id);
  if (!item) return;

  item.qty += amt;

  if (item.qty <= 0) {
    cart = cart.filter(i => i.id !== id);
  }

  saveCart(cart);
  loadCheckout();
}

/* ===============================
✅ CLEAR CART
=============================== */
function clearCart() {
  localStorage.removeItem("cart");
  loadCheckout();
}

/* ===============================
✅ WHATSAPP
=============================== */
function whatsappCheckout() {

  let cart = getCart();
  let msg = "🧾 Tinkers Order\n\n";
  let total = 0;

  cart.forEach(item => {
    let sub = item.price * item.qty;
    total += sub;

    msg += `${item.name} x${item.qty} - R ${sub.toFixed(2)}\n`;
  });

  msg += `\nTotal: R ${total.toFixed(2)}`;

  window.open(
    `https://wa.me/27720912943?text=${encodeURIComponent(msg)}`,
    "_blank"
  );
}

/* ===============================
✅ PAYFAST (TEMP)
=============================== */
function payFastCheckout() {

  let cart = getCart();
  let total = 0;

  cart.forEach(item => {
    total += item.price * item.qty;
  });

  if (total === 0) {
    alert("Cart is empty ❌");
    return;
  }

  alert("Proceed to PayFast: R " + total.toFixed(2));
}

document.addEventListener("DOMContentLoaded", loadCheckout);

</script>

</body>
</html>
