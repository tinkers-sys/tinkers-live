<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tinkers Checkout</title>

<link rel="stylesheet" href="css/styles.css">
<link rel="stylesheet" href="css/additions.css">

</head>

<body>

<header class="header">
  <div class="container">
    <h2>Checkout</h2>

    <nav>
      <a href="index.html">Home</a>
    </nav>
  </div>
</header>

<main class="container">

  <h2>Your Cart</h2>

  <!-- ✅ CART GRID -->
  <div id="cart"></div>

  <!-- ✅ TOTAL -->
  <h3>Total: <span id="checkoutTotal">R0</span></h3>

  <!-- ✅ ACTION BUTTONS -->
  <div class="checkout-actions">

    <button class="btn-clear" onclick="clearCart()">
      Clear Cart
    </button>

    <button class="btn-whatsapp" onclick="whatsappCart()">
      Checkout via WhatsApp
    </button>

    <button class="btn-payflex" onclick="payflexCheckout()">
  Pay with Payflex (Sandbox)
</button>

  </div>

</main>

<script src="js/app.js"></script>

</body>
</html>
