<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tinkers | Checkout</title>

  <!-- ✅ Correct CSS links -->
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/additions.css">
</head>

<body>

<header class="header">
  <h2>Tinkers</h2>
  <nav>
    <a href="index.html">← Back to shop</a>
  </nav>
</header>

<main class="checkout-wrap">

  <h2>Checkout</h2>

  <!-- ✅ Cart items (rendered by JS) -->
  <div id="cart" class="checkout-cart"></div>

  <!-- ✅ Summary + Buttons -->
  <div class="checkout-summary">
    <div class="checkout-total">
      Total: <strong id="checkoutTotal">R0</strong>
    </div>

    <div class="checkout-actions">
      <button class="primary-btn" onclick="payNow()">
        Pay with PayFast
      </button>

      <button class="secondary-btn" onclick="clearCart()">
        Clear cart
      </button>
    </div>

    <p class="cart-note">
      Sandbox checkout via PayFast (test mode).
    </p>
  </div>

</main>

<!-- ✅ Hidden PayFast Sandbox Form -->
<form id="payfastForm"
      action="https://sandbox.payfast.co.za/eng/process"
      method="post"
      style="display:none;">

  <input type="hidden" name="merchant_id" value="10000100">
  <input type="hidden" name="merchant_key" value="46f0cd694581a">

  <input type="hidden"
         name="return_url"
         value="https://tinkers-sys.github.io/tinkers-live/thank-you.html">

  <input type="hidden"
         name="cancel_url"
         value="https://tinkers-sys.github.io/tinkers-live/checkout.html">

  <input type="hidden"
         name="notify_url"
         value="https://example.com/notify">

  <input type="hidden" name="amount" id="pf_amount">
  <input type="hidden" name="item_name" id="pf_item_name">
</form>

<script src="js/app.js"></script>

</body>
</html>
