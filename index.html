<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tinkers</title>

<link rel="stylesheet" href="css/additions.css">
</head>

<body>

<header class="header">
  <div class="container header-top">
    <h2>Tinkers</h2>

    <nav>
      <a href="index.html">Home</a>
      <a href="checkout.html">Checkout</a>
      <button onclick="toggleCart()">🛒 Cart</button>
    </nav>
  </div>
</header>

<!-- FILTERS -->
<div class="container">
  <div class="filters">
    <a href="#" data-filter="all">All</a>
    <a href="#" data-filter="apparel">Apparel</a>
    <a href="#" data-filter="art">Art</a>
    <a href="#" data-filter="accessories">Accessories</a>
  </div>
</div>

<div class="container">

  <!-- HERO -->
  <div class="hero">
    <h1>Authentic African Craftsmanship</h1>
    <p>Curated pieces that tell real African stories</p>
  </div>

  <h2>Our Collection</h2>
  <div id="products" class="products"></div>

</div>

<!-- CART DRAWER -->
<div id="cartDrawer" class="cart-drawer">

  <div class="cart-header">
    <h3>Your Cart</h3>
    <button onclick="toggleCart()">✕</button>
  </div>

  <div id="cartItems"></div>

  <div class="cart-footer">
    <p>Total: R<span id="cartTotal">0</span></p>

    <a href="checkout.html">
      <button class="checkout-btn">Go to Checkout</button>
    </a>

    <button onclick="clearCart()">Clear</button>
  </div>

</div>

<script src="js/app.js"></script>

</body>
</html>
