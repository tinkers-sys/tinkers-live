<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tinkers Admin</title>

<link rel="stylesheet" href="css/styles.css">
<link rel="stylesheet" href="css/additions.css">

<style>
body { background:#f4f4f4; }

.admin-card {
  background:white;
  padding:20px;
  margin-bottom:20px;
  border-radius:8px;
  box-shadow:0 2px 6px rgba(0,0,0,0.1);
}

table {
  width:100%;
  border-collapse: collapse;
}

th, td {
  padding:10px;
  border-bottom:1px solid #ddd;
}

th {
  background:#333;
  color:white;
}
</style>

</head>

<body>

<header class="header">
  <h2>Admin Dashboard</h2>
</header>

<main style="padding:20px;">

<div class="admin-card">
  <h3>Add Product</h3>

  <input id="newId" placeholder="Product ID">
  <input id="newName" placeholder="Product Name">
  <input id="newCategory" placeholder="Category">
  <input id="newPrice" placeholder="Price">
  <input id="newImage" placeholder="image.jpg">
  <input id="newStock" placeholder="Stock">

  <button onclick="addProduct()">Add</button>
</div>

<div class="admin-card">
  <h3>Inventory</h3>
  <table>
    <thead>
      <tr>
        <th>Image</th>
        <th>Name</th>
        <th>Stock</th>
      </tr>
    </thead>
    <tbody id="inventoryTable"></tbody>
  </table>
</div>

</main>

<script>
const INVENTORY_URL = "https://opensheet.elk.sh/1ObeXTE1sUyh5yXuGL4EV34fn1BM_bfSzzMuI7WiLASc/Sheet1";

/* ✅ LOAD INVENTORY */
async function loadInventory() {
  const res = await fetch(INVENTORY_URL);
  const data = await res.json();

  const table = document.getElementById("inventoryTable");
  table.innerHTML = "";

  data.forEach(p => {

    table.innerHTML += `
      <tr>
        <td><img src="images/${p.image}" width="50"></td>
        <td>${p.name}</td>
        <td>${p.stock}</td>
      </tr>
    `;
  });
}

/* ✅ ADD PRODUCT (basic test) */
function addProduct() {
  alert("Add product connected ✅");
}

/* ✅ INIT */
loadInventory();
</script>

</body>
</html>
``
