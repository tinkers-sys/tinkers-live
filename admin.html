<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tinkers Admin</title>

<link rel="stylesheet" href="css/styles.css">
<link rel="stylesheet" href="css/additions.css">

<style>
body {
  background:#f4f4f4;
  font-family: Arial;
}

.admin-card {
  background:white;
  padding:20px;
  margin-bottom:20px;
  border-radius:8px;
  box-shadow:0 2px 6px rgba(0,0,0,0.1);
}

table {
  width:100%;
  border-collapse: collapse;
  margin-top:15px;
}

th, td {
  padding:10px;
  border-bottom:1px solid #ddd;
}

th {
  background:#333;
  color:white;
}

input {
  padding:8px;
  margin-bottom:10px;
  width:100%;
}

button {
  background:#c55a11;
  color:white;
  border:none;
  padding:8px 12px;
  border-radius:6px;
  cursor:pointer;
}

.delete-btn {
  background:#e74c3c;
}
</style>
</head>

<body>

<header class="header">
  <h2>Admin Dashboard</h2>
</header>

<main style="padding:20px;">

<!-- ✅ ADD PRODUCT -->
<div class="admin-card">
  <h3>➕ Add Product</h3>

  <input id="newId" placeholder="Product ID (unique)">
  <input id="newName" placeholder="Product Name">
  <input id="newCategory" placeholder="Category">
  <input id="newPrice" placeholder="Price">
  <input id="newImage" placeholder="Image filename (e.g mask.jpg)">
  <input id="newStock" placeholder="Stock">

  <button onclick="addProduct()">Add Product</button>
</div>

<!-- ✅ INVENTORY TABLE -->
<div class="admin-card">
  <h3>📦 Inventory</h3>

  <table id="inventoryTable">
    <thead>
      <tr>
        <th>Product</th>
        <th>Stock</th>
        <th>Update</th>
        <th>Delete</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>
</div>

<!-- ✅ ORDERS -->
<div class="admin-card">
  <h3>📊 Orders</h3>

  <table id="ordersTable">
    <thead>
      <tr>
        <th>Date</th>
        <th>Product</th>
        <th>Qty</th>
        <th>Total</th>
        <th>Status</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>
</div>

</main>

<script>

const INVENTORY_URL = "https://opensheet.elk.sh/1ObeXTE1sUyh5yXuGL4EV34fn1BM_bfSzzMuI7WiLASc/Sheet1";
const ORDERS_URL = "https://opensheet.elk.sh/1ObeXTE1sUyh5yXuGL4EV34fn1BM_bfSzzMuI7WiLASc/Orders";
const SCRIPT_URL = "PASTE_YOUR_SCRIPT_URL_HERE";

/* ===============================
   LOAD INVENTORY
================================ */
async function loadInventory() {
  const res = await fetch(INVENTORY_URL);
  const data = await res.json();

  const table = document.querySelector("#inventoryTable tbody");
  table.innerHTML = "";

  data.forEach(p => {
    table.innerHTML += `
      <tr>
        <td>${p.name}</td>

        <td>
          <input type="number" value="${p.stock}" id="stock-${p.id}">
        </td>

        <td>
          <button onclick="updateStock('${p.id}')">Save</button>
        </td>

        <td>
          <button class="delete-btn" onclick="deleteProduct('${p.id}')">
            Delete
          </button>
        </td>
      </tr>
    `;
  });
}

/* ===============================
   ADD PRODUCT
================================ */
function addProduct() {

  const id = newId.value;
  const name = newName.value;
  const category = newCategory.value;
  const price = newPrice.value;
  const image = newImage.value;
  const stock = newStock.value;

  if (!id || !name || !price) {
    alert("Fill required fields");
    return;
  }

  fetch(`${SCRIPT_URL}?addProduct=true&id=${id}&name=${name}&category=${category}&price=${price}&image=${image}&stock=${stock}`)
    .then(res => res.text())
    .then(() => {
      alert("Product added ✅");
      loadInventory();
    });
}

/* ===============================
   UPDATE STOCK
================================ */
function updateStock(id) {

  const newStockValue = document.getElementById(`stock-${id}`).value;

  fetch(`${SCRIPT_URL}?updateStockId=${id}&newStock=${newStockValue}`)
    .then(res => res.text())
    .then(() => {
      alert("Stock updated ✅");
      loadInventory();
    });
}

/* ===============================
   DELETE PRODUCT
================================ */
function deleteProduct(id) {

  if (!confirm("Delete this product?")) return;

  fetch(`${SCRIPT_URL}?deleteId=${id}`)
    .then(res => res.text())
    .then(() => {
      alert("Deleted ✅");
      loadInventory();
    });
}

/* ===============================
   LOAD ORDERS
================================ */
async function loadOrders() {

  const res = await fetch(ORDERS_URL);
  const data = await res.json();

  const table = document.querySelector("#ordersTable tbody");
  table.innerHTML = "";

  data.forEach((o, i) => {

    const row = i + 2;

    table.innerHTML += `
      <tr>
        <td>${o.date}</td>
        <td>${o.product}</td>
        <td>${o.qty}</td>
        <td>R${o.total}</td>
        <td>
          <select onchange="updateStatus(${row}, this.value)">
            <option ${o.status=="Pending"?"selected":""}>Pending</option>
            <option ${o.status=="Processing"?"selected":""}>Processing</option>
            <option ${o.status=="Delivered"?"selected":""}>Delivered</option>
          </select>
        </td>
      </tr>
    `;
  });
}

/* ===============================
   UPDATE ORDER STATUS
================================ */
function updateStatus(row, status) {

  fetch(`${SCRIPT_URL}?updateStatus=true&row=${row}&status=${status}`)
    .then(res => res.text())
    .then(() => {
      alert("Status updated ✅");
      loadOrders();
    });
}

loadInventory();
loadOrders();

</script>

</body>
</html>
``
