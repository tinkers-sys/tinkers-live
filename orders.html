<!DOCTYPE html>
<html>
<head>
  <title>Order History | Tinkers</title>

  css/styles.css
  css/additions.css
</head>

<body>

<!-- ===============================
✅ HEADER
=============================== -->
<header class="header">
  <div class="container">
    <h2>Order History</h2>
    <nav>
      <a href="index.html">Home</a>
    </nav>
  </div>
</header>

<!-- ===============================
✅ MAIN
=============================== -->
<main style="max-width:900px; margin:40px auto;">

  <h2>📦 Your Orders</h2>

  <div id="ordersList"></div>

</main>

<!-- ===============================
✅ SCRIPT
=============================== -->
<script>

function loadOrders() {

  let orders;

  try {
    orders = JSON.parse(localStorage.getItem("orderHistory")) || [];
  } catch {
    orders = [];
  }

  const container = document.getElementById("ordersList");

  // ✅ EMPTY STATE
  if (!orders || orders.length === 0) {
    container.innerHTML = `
      <div style="
        background:white;
        padding:20px;
        border-radius:10px;
        text-align:center;
      ">
        <p>No orders found ❌</p>
        <a href="index.html">Start Shopping</a>
      </div>
    `;
    return;
  }

  let html = "";

  // ✅ SHOW LATEST FIRST
  orders.slice().reverse().forEach(order => {

    let itemsHTML = "";

    if (order.items && order.items.length) {
      order.items.forEach(item => {
        itemsHTML += `
          <p>${item.name} x${item.qty} - R${item.subtotal}</p>
        `;
      });
    }

    html += `
      <div style="
        background:white;
        padding:20px;
        margin-bottom:20px;
        border-radius:10px;
        box-shadow:0 2px 8px rgba(0,0,0,0.1);
      ">

        <h3>Order ID: ${order.orderID || "N/A"}</h3>

        <p><strong>Date:</strong> ${order.date || "N/A"}</p>

        <hr>

        ${itemsHTML || "<p>No items found</p>"}

        <h3 style="color:#27ae60;">Total: R${order.total || "0.00"}</h3>

      </div>
    `;
  });

  container.innerHTML = html;
}

// ✅ INIT
document.addEventListener("DOMContentLoaded", loadOrders);

</script>

</body>
</html>
