<!DOCTYPE html>
<html>
<head>
  <title>Sales Dashboard</title>

  css/styles.css
  css/additions.css
</head>

<body>

<header class="header">
  <div class="container">
    <h2>Sales Dashboard</h2>
    <nav>
      <a href="index.html">Home</a>
      orders.htmlOrders</a>
    </nav>
  </div>
</header>

<main style="max-width:1000px; margin:40px auto;">

  <h2>📊 Business Overview</h2>

  <div id="summary"></div>

  <h2>🔥 Top Products</h2>
  <div id="topProducts"></div>

  <h2>🧾 Recent Orders</h2>
  <div id="recentOrders"></div>

</main>

<script>

  const orders = JSON.parse(localStorage.getItem("orderHistory") || []);

  let totalRevenue = 0;
  const productSales = {};

  /* ✅ CALCULATIONS */
  orders.forEach(order => {
    totalRevenue += order.total;

    order.items.forEach(item => {
      if(!productSales[item.name]){
        productSales[item.name] = 0;
      }
      productSales[item.name] += item.qty;
    });
  });

  /* ✅ SUMMARY */
  document.getElementById("summary").innerHTML = `
    <div style="display:flex; gap:20px; margin:20px 0;">
      <div class="card">
        <h3>Total Sales</h3>
        <p>R${totalRevenue}</p>
      </div>
      <div class="card">
        <h3>Total Orders</h3>
        <p>${orders.length}</p>
      </div>
    </div>
  `;

  /* ✅ TOP PRODUCTS */
  let topHTML = "";

  Object.entries(productSales)
    .sort((a,b) => b[1] - a[1])
    .slice(0,5)
    .forEach(product => {
      topHTML += `<p>${product[0]} - ${product[1]} sold</p>`;
    });

  document.getElementById("topProducts").innerHTML = topHTML;

  /* ✅ RECENT ORDERS */
  let orderHTML = "";

  orders.slice(-5).reverse().forEach(order => {

    let items = "";
    order.items.forEach(i => {
      items += `<p>${i.name} x${i.qty}</p>`;
    });

    orderHTML += `
      <div class="card" style="margin-bottom:15px;">
        <h3>${order.orderID}</h3>
        <p>${order.date}</p>
        ${items}
        <strong>Total: R${order.total}</strong>
      </div>
    `;
  });

  document.getElementById("recentOrders").innerHTML = orderHTML;

</script>

</body>
</html>
