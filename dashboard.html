<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sales Dashboard</title>

<link rel="stylesheet" href="css/styles.css">
<link rel="stylesheet" href="css/additions.css">
 
  <!-- ✅ ADD CHART.JS HERE -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

</head>

<body>

<header class="header">
  <div class="container">
    <h2>📊 Sales Dashboard</h2>
    <nav>
      <a href="index.html">Home</a>
      <a href="orders.html">Orders</a>
    </nav>
  </div>
</header>

<main class="dashboard-container">

  <!-- ✅ SUMMARY -->
  <section class="summary">
    <div class="summary-card">
      <h3>Total Revenue</h3>
      <p id="totalRevenue">R0</p>
    </div>

    <div class="summary-card">
      <h3>Total Orders</h3>
      <p id="totalOrders">0</p>
    </div>
  </section>

  <!-- ✅ TOP PRODUCTS -->
  <section>
    <h2>🔥 Top Products</h2>
    <div id="topProducts" class="dashboard-grid"></div>
  </section>

<!-- ✅ ✅ ADD THIS HERE -->
  <section>
    <h2>📊 Sales Chart</h2>
    <canvas id="salesChart"></canvas>
  </section>

  <!-- ✅ RECENT ORDERS -->
  <section>
    <h2>🧾 Recent Orders</h2>
    <div id="recentOrders"></div>
  </section>

</main>

<script>

const orders = JSON.parse(localStorage.getItem("orderHistory") || "[]");

/* =============================
   ✅ SUMMARY
============================= */
let totalRevenue = 0;

orders.forEach(order => {
  totalRevenue += order.total || 0;
});

document.getElementById("totalRevenue").innerText = "R" + totalRevenue;
document.getElementById("totalOrders").innerText = orders.length;


/* =============================
   ✅ TOP PRODUCTS
============================= */
const productSales = {};

orders.forEach(order => {
  if(!order.items) return;

  order.items.forEach(item => {
    if(!productSales[item.name]){
      productSales[item.name] = 0;
    }
    productSales[item.name] += item.qty;
  });
});

/* DISPLAY TOP PRODUCTS */
let topHTML = "";

Object.entries(productSales)
  .sort((a,b) => b[1] - a[1])
  .slice(0,5)
  .forEach(product => {

    topHTML += `
      <div class="dashboard-card">
        <h3>${product[0]}</h3>
        <p>${product[1]} sold</p>
      </div>
    `;
  });

document.getElementById("topProducts").innerHTML =
  topHTML || "<p>No sales yet</p>";


/* =============================
   ✅ RECENT ORDERS
============================= */
let ordersHTML = "";

orders.slice(-5).reverse().forEach(order => {

  let itemsHTML = "";

  if(order.items){
    order.items.forEach(i => {
      itemsHTML += `<li>${i.name} x${i.qty}</li>`;
    });
  }

  ordersHTML += `
    <div class="dashboard-card">

      <div class="order-header">
        <h3>${order.orderID || "Order"}</h3>
        <span>${order.date || ""}</span>
      </div>

      <div class="customer-info">
        <p>${order.customer?.name || "N/A"}</p>
        <p>${order.customer?.phone || ""}</p>
      </div>

      <ul class="order-items">
        ${itemsHTML}
      </ul>

      <div class="order-total">
        Total: R${order.total || 0}
      </div>

    </div>
  `;
});

document.getElementById("recentOrders").innerHTML =
  ordersHTML || "<p>No orders yet</p>";


/* =============================
   ✅ SALES CHART (FINAL FIXED)
============================= */

const productNames = [];
const productValues = [];

Object.entries(productSales)
  .sort((a,b) => b[1] - a[1])
  .slice(0,5)
  .forEach(product => {
    productNames.push(product[0]);
    productValues.push(product[1]);
  });

const ctx = document.getElementById("salesChart");

/* ✅ ONLY CREATE CHART IF CANVAS EXISTS */
if(ctx){
  new Chart(ctx, {
    type: "bar",
    data: {
      labels: productNames,
      datasets: [{
        label: "Units Sold",
        data: productValues,
        backgroundColor: "#c55a11",
        borderRadius: 6
      }]
    },
    options: {
      responsive: true,
      plugins: {
        legend: { display: false }
      },
      scales: {
        y: {
          beginAtZero: true,
          ticks: {
            stepSize: 1
          }
        }
      }
    }
  });
}

</script>
