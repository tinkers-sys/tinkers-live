<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Tinkers Dashboard</title>

  <link rel="stylesheet" href="css/additions.css">
</head>

<body class="container">

<h1>📊 Tinkers Admin Dashboard</h1>

<!-- ===============================
✅ SUMMARY STATS
=============================== -->
<div class="dashboard-stats">
  <div class="stat-box">
    <h2 id="totalSales">R 0.00</h2>
    <p>Total Sales</p>
  </div>

  <div class="stat-box">
    <h2 id="totalOrders">0</h2>
    <p>Orders</p>
  </div>

  <div class="stat-box">
    <h2 id="lowStockCount">0</h2>
    <p>Low Stock Items</p>
  </div>
</div>

<!-- ===============================
✅ ORDER TABLE
=============================== -->
<h2>Orders</h2>
<table class="dashboard-table">
  <thead>
    <tr>
      <th>Date</th>
      <th>Product</th>
      <th>Qty</th>
      <th>Total</th>
    </tr>
  </thead>
  <tbody id="ordersTable"></tbody>
</table>

<!-- ===============================
✅ SCRIPT
=============================== -->
<script>

const SHEET_URL = "https://opensheet.elk.sh/1ObeXTE1sUyh5yXuGL4EV34fn1BM_bfSzzMuI7WiLASc";

/* ===============================
✅ LOAD DASHBOARD
=============================== */
async function loadDashboard() {

  const orders = await fetch(SHEET_URL + "/Orders").then(r => r.json());
  const products = await fetch(SHEET_URL + "/Sheet1").then(r => r.json());

  let totalSales = 0;
  let totalOrders = orders.length;

  let html = "";

  orders.forEach(o => {
    totalSales += parseFloat(o.total || 0);

    html += `
      <tr>
        <td>${o.timestamp}</td>
        <td>${o.name}</td>
        <td>${o.qty}</td>
        <td>R ${o.total}</td>
      </tr>
    `;
  });

  document.getElementById("ordersTable").innerHTML = html;

  document.getElementById("totalSales").innerText =
    "R " + totalSales.toFixed(2);

  document.getElementById("totalOrders").innerText =
    totalOrders;

  /* ===============================
  ✅ LOW STOCK CHECK
  =============================== */
  let lowStock = 0;

  products.forEach(p => {
    if (parseInt(p.stock) <= 3) {
      lowStock++;
    }
  });

  document.getElementById("lowStockCount").innerText =
    lowStock;
}

/* ===============================
✅ INIT
=============================== */
document.addEventListener("DOMContentLoaded", loadDashboard);

</script>

</body>
</html>
