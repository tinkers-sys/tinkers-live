<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sales Dashboard</title>

<link rel="stylesheet" href="css/styles.css">
<link rel="stylesheet" href="css/additions.css">

</head>

<body>

<header class="header">
  <div class="container">
    <h2>📊 Sales Dashboard</h2>
    <nav>
      <a href="index.html">Home</a>
      <a href="orders.html">Orders</a>
    </nav>
  </div>
</header>

<main class="dashboard-container">

  <!-- ✅ SUMMARY -->
  <section class="summary">
    <div class="summary-card">
      <h3>Total Revenue</h3>
      <p id="totalRevenue">R0</p>
    </div>

    <div class="summary-card">
      <h3>Total Orders</h3>
      <p id="totalOrders">0</p>
    </div>
  </section>

  <!-- ✅ TOP PRODUCTS -->
  <section>
    <h2>🔥 Top Products</h2>
    <div id="topProducts" class="dashboard-grid"></div>
  </section>

  <!-- ✅ RECENT ORDERS -->
  <section>
    <h2>🧾 Recent Orders</h2>
    <div id="recentOrders"></div>
  </section>

</main>

<script>

const orders = JSON.parse(localStorage.getItem("orderHistory") || "[]");

/* =============================
   ✅ SUMMARY
============================= */
let totalRevenue = 0;

orders.forEach(order => {
  totalRevenue += order.total;
});

document.getElementById("totalRevenue").innerText = "R" + totalRevenue;
document.getElementById("totalOrders").innerText = orders.length;


/* =============================
   ✅ TOP PRODUCTS
============================= */
const productSales = {};

orders.forEach(order => {
  order.items.forEach(item => {
    if(!productSales[item.name]){
      productSales[item.name] = 0;
    }
    productSales[item.name] += item.qty;
  });
});

let topHTML = "";

Object.entries(productSales)
  .sort((a,b) => b[1] - a[1])
  .slice(0,5)
  .forEach(product => {

    topHTML += `
      <div class="dashboard-card">
        <h3>${product[0]}</h3>
        <p>${product[1]} sold</p>
      </div>
    `;
  });

document.getElementById("topProducts").innerHTML =
  topHTML || "<p>No sales yet</p>";


/* =============================
   ✅ RECENT ORDERS
============================= */
let ordersHTML = "";

orders.slice(-5).reverse().forEach(order => {

  let itemsHTML = "";

  order.items.forEach(i => {
    itemsHTML += `<li>${i.name} x${i.qty}</li>`;
  });

  ordersHTML += `
    <div class="dashboard-card">

      <div class="order-header">
        <h3>${order.orderID}</h3>
        <span>${order.date || ""}</span>
      </div>

      <div class="customer-info">
       <p>${order.customer?.name || "N/A"}</p>
       <p>${order.customer?.phone || ""}</p>
      </div>

      <ul class="order-items">
        ${itemsHTML}
      </ul>

      <div class="order-total">
        Total: R${order.total}
      </div>

    </div>
  `;
});

document.getElementById("recentOrders").innerHTML =
  ordersHTML || "<p>No orders yet</p>";

</script>

</body>
</html>
