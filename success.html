<!DOCTYPE html>
<html>
<head>
  <title>Order Receipt | Tinkers</title>

  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/additions.css">
</head>

<body>

<div style="max-width:600px; margin:50px auto; text-align:center;">

  <h1>✅ Order Successful</h1>
  <p>Thank you for your purchase!</p>

  <div id="receiptBox" style="text-align:left; margin-top:20px;"></div>

  <h3 id="receiptTotal"></h3>

  <div style="margin-top:20px;">
    <button onclick="sendReceipt()">Send via WhatsApp</button>
    <button onclick="goHome()">Return to Store</button>
  </div>

</div>

<script>

// ✅ SAFE LOAD ORDER
let order;

try {
  order = JSON.parse(localStorage.getItem("lastOrder"));
} catch {
  order = null;
}

const receiptBox = document.getElementById("receiptBox");
const receiptTotal = document.getElementById("receiptTotal");

// ❌ NO ORDER FOUND
if (!order || !order.items) {

  receiptBox.innerHTML = `
    <p>No order found ❌</p>
    <p>Please contact support or try again.</p>
  `;

} else {

  let html = "";
  let text = "";

  order.items.forEach(item => {
    html += `<p>${item.name} x${item.qty} - R${item.subtotal}</p>`;
    text += `• ${item.name} x${item.qty} - R${item.subtotal}\n`;
  });

  receiptBox.innerHTML = `
    <p><strong>Order ID:</strong> ${order.orderID}</p>
    <p><strong>Date:</strong> ${order.date || ""}</p>
    <hr>
    ${html}
  `;
function formatCurrency(amount) {
  return new Intl.NumberFormat('en-ZA', {
    style: 'currency',
    currency: 'ZAR',
    minimumFractionDigits: 2
  }).format(amount);
}
  receiptTotal.innerText = "Total Paid: " + formatCurrency(Number(order.total));

  // ✅ PREVENT DUPLICATE ORDER HISTORY
  let history;

  try {
    history = JSON.parse(localStorage.getItem("orderHistory")) || [];
  } catch {
    history = [];
  }

  const exists = history.find(o => o.orderID === order.orderID);

  if (!exists) {
    history.push(order);
    localStorage.setItem("orderHistory", JSON.stringify(history));
  }

  // ✅ SAVE RECEIPT FOR WHATSAPP
  localStorage.setItem("lastReceipt", JSON.stringify({
    id: order.orderID,
    text: text,
    total: order.total
  }));

  // ✅ CLEAR CART ONLY IF VALID ORDER
  localStorage.removeItem("cart");
}


// ✅ NAVIGATION
function goHome(){
  window.location.href = "/tinkers-live/index.html";
}


// ✅ WHATSAPP RECEIPT
function sendReceipt(){

  let receipt;

  try {
    receipt = JSON.parse(localStorage.getItem("lastReceipt"));
  } catch {
    receipt = null;
  }

  if(!receipt){
    alert("No receipt found ❌");
    return;
  }

  let message = `🧾 Tinkers Receipt\n\n`;
  message += `Order ID: ${receipt.id}\n\n`;
  message += receipt.text;
  message += `\nTotal Paid: R${receipt.total}`;

  const phone = "27720912943";

  window.open(
    `https://wa.me/${phone}?text=${encodeURIComponent(message)}`,
    "_blank"
  );
}


// ✅ AUTO REDIRECT (optional UX)
setTimeout(() => {
  window.location.href = "/tinkers-live/index.html";
}, 12000);

</script>

</body>
</html>
setTimeout(() => {
  location.href = "index.html";
}, 2000);
