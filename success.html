<!DOCTYPE html>
<html>
<head>
  <title>Order Receipt</title>

  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/additions.css">
</head>

<body>

<div style="max-width:600px; margin:50px auto; text-align:center;">

  <h1>✅ Order Successful</h1>
  <p>Thank you for your purchase!</p>

  <div id="receiptBox" style="text-align:left; margin-top:20px;"></div>

  <h3 id="receiptTotal"></h3>

  <button onclick="sendReceipt()">Send via WhatsApp</button>
  <button onclick="goHome()">Return to Store</button>

</div>

<script>

  // ✅ GET SAVED ORDER (NOT CART)
  const order = JSON.parse(localStorage.getItem("lastOrder"));

  const receiptBox = document.getElementById("receiptBox");
  const receiptTotal = document.getElementById("receiptTotal");

  if(!order || !order.items){
    receiptBox.innerHTML = "<p>No order found ❌</p>";
  } else {

    let html = "";
    let text = "";

    order.items.forEach(item => {
      html += `<p>${item.name} x${item.qty} - R${item.subtotal}</p>`;
      text += `• ${item.name} x${item.qty} - R${item.subtotal}\n`;
    });

    receiptBox.innerHTML = `
      <p><strong>Order ID:</strong> ${order.orderID}</p>
      <p><strong>Date:</strong> ${order.date || ""}</p>
      <hr>
      ${html}
    `;

    receiptTotal.innerText = "Total Paid: R" + order.total;

    // ✅ SAVE ORDER HISTORY
    const history = JSON.parse(localStorage.getItem("orderHistory") || "[]");
    history.push(order);
    localStorage.setItem("orderHistory", JSON.stringify(history));

    // ✅ STORE FOR WHATSAPP
    localStorage.setItem("lastReceipt", JSON.stringify({
      id: order.orderID,
      text: text,
      total: order.total
    }));

    // ✅ CLEAR CART
    localStorage.removeItem("cart");
  }

  function goHome(){
    window.location.href = "/tinkers-live/index.html";
  }

  function sendReceipt(){

    const receipt = JSON.parse(localStorage.getItem("lastReceipt"));

    if(!receipt){
      alert("No receipt found ❌");
      return;
    }

    let message = `🧾 Tinkers Receipt\n\n`;
    message += `Order ID: ${receipt.id}\n\n`;
    message += receipt.text;
    message += `\nTotal Paid: R${receipt.total}`;

    const phone = "27720912943"; // ✅ your number

    window.open(
      `https://wa.me/${phone}?text=${encodeURIComponent(message)}`,
      "_blank"
    );
  }

</script>

</body>
</html>
